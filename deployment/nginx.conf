# nginx configuration for docs.web-labels.de
#
# This configuration serves the MkDocs documentation site with:
# - Public access to all pages except /internal/
# - Basic auth protection for /internal/ paths
#
# Setup:
# 1. Copy this file to /etc/nginx/sites-available/docs.web-labels.de
# 2. Create symlink: ln -s /etc/nginx/sites-available/docs.web-labels.de /etc/nginx/sites-enabled/
# 3. Create htpasswd file (see below)
# 4. Test config: nginx -t
# 5. Reload nginx: systemctl reload nginx
#
# Create htpasswd file:
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-docs username
#   sudo htpasswd /etc/nginx/.htpasswd-docs another_user  # add more users

server {
    listen 80;
    server_name docs.web-labels.de;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name docs.web-labels.de;

    # SSL certificates (adjust paths as needed)
    ssl_certificate /etc/letsencrypt/live/docs.web-labels.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.web-labels.de/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Document root - where the built MkDocs site is deployed
    root /var/www/docs;
    index index.html;

    # Logging
    access_log /var/log/nginx/docs.web-labels.de.access.log;
    error_log /var/log/nginx/docs.web-labels.de.error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Public documentation - no auth required
    location / {
        try_files $uri $uri/ =404;
    }

    # Internal documentation - basic auth required
    # Covers both /internal/ and language-specific paths like /de/internal/, /en/internal/
    location ~ ^/(de/|en/)?internal/ {
        auth_basic "Internal Documentation";
        auth_basic_user_file /etc/nginx/.htpasswd-docs;
        try_files $uri $uri/ =404;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
