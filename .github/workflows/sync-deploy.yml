name: Sync & Deploy Documentation

on:
  schedule:
    - cron: "0 */12 * * *" # Every 6 hours
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [ docs-updated ]

permissions:
  contents: write
  pages: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Sync plugin documentation
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          # Define plugins (repo-name:folder-name)
          declare -A PLUGINS=(
            ["WebLa_Produktberater"]="WebLa_Produktberater"
            ["WebLa_MediaBooster"]="WebLa_MediaBooster"
            ["WebLa_CustomerSpecificDiscounts"]="WebLa_CustomerSpecificDiscounts"
            ["WebLa_IntelligentCrossSelling"]="WebLa_IntelligentCrossSelling"
            ["WebLa_UTMHandler"]="WebLa_UTMHandler"
            ["WebLa_BeautifiedSearch"]="WebLa_BeautifiedSearch"
            ["WebLa_ExportDiscount"]="WebLa_ExportDiscount"
            ["WebLa_ProductSliderAdvanced"]="WebLa_ProductSliderAdvanced"
            ["WebLa_Zusatzoptionen"]="WebLa_Zusatzoptionen"
            ["WebLa_CategorieQuickFilter"]="WebLa_CategorieQuickFilter"
            ["WebLa_ContactFormFileUpload"]="WebLa_ContactFormFileUpload"
            ["WebLa_DeliveryDateSelector"]="WebLa_DeliveryDateSelector"
            ["WebLa_SplitComission"]="WebLa_SplitComission"
            ["BuildIT_ShareCart"]="BuildIT_ShareCart"
            ["WebLa_UltimativeBundlePlugin"]="WebLa_UltimativeBundlePlugin"
            ["WebLa_Subscriptions"]="WebLa_Subscriptions"
            ["WebLaAdcellProvisionsfreigabe"]="WebLa_AdcellProvisionsfreigabe"
            ["WebLa_TaxCalculatorAndCountrySwitcher"]="WebLa_TaxCalculatorAndCountrySwitcher"
            ["WebLa_ImageReviews"]="WebLa_ImageReviews"
            ["WebLa_BatchManagement"]="WebLa_BatchManagement"
            ["WebLa_ManufacturerPages"]="WebLa_ManufacturerPages"
            ["WebLa_CategorySorter"]="WebLa_CategorySorter"
            ["WebLa_AdminProductFilters"]="WebLa_AdminProductFilters"
            ["WebLa_FlyoutNavigation"]="WebLa_FlyoutNavigation"
            ["WebLa_CurrencyChanger"]="WebLa_CurrencyChanger"
            ["WebLa_Blog"]="WebLa_Blog"
            ["WebLa_PropertyNotes"]="WebLa_PropertyNotes"
            ["WebLa_CustomerTaxCountry"]="WebLa_CustomerTaxCountry"
          )

          declare -A PLUGIN_FOLDERS=(
            ["WebLa_Produktberater"]="WebLa_Produktberater"
            ["WebLa_MediaBooster"]="WeblaMediaBooster"
            ["WebLa_CustomerSpecificDiscounts"]="WebLaCustomerSpecificDiscounts"
            ["WebLa_IntelligentCrossSelling"]="WebLa_IntelligentCrossSelling"
            ["WebLa_UTMHandler"]="WebLa_UTMHandler"
            ["WebLa_BeautifiedSearch"]="WebLa_BeautifiedSearch"
            ["WebLa_ExportDiscount"]="WebLa_ExportDiscount"
            ["WebLa_ProductSliderAdvanced"]="WebLa_ProductSliderAdvanced"
            ["WebLa_Zusatzoptionen"]="webla_zusatzoptionen"
            ["WebLa_CategorieQuickFilter"]="WebLa_CategorieQuickFilter"
            ["WebLa_ContactFormFileUpload"]="WebLa_ContactFormFileUpload"
            ["WebLa_DeliveryDateSelector"]="WebLa_DeliveryDateSelector"
            ["WebLa_SplitComission"]="WebLa_SplitComission"
            ["BuildIT_ShareCart"]="BuildIT_ShareCart"
            ["WebLa_UltimativeBundlePlugin"]="WebLa_UltimativeBundlePlugin"
            ["WebLa_Subscriptions"]="WebLa_Subscriptions"
            ["WebLaAdcellProvisionsfreigabe"]="WebLa_AdcellProvisionsfreigabe"
            ["WebLa_TaxCalculatorAndCountrySwitcher"]="WebLa_TaxCalculatorAndCountrySwitcher"
            ["WebLa_ImageReviews"]="WebLa_ImageReviews"
            ["WebLa_BatchManagement"]="WebLa_BatchManagement"
            ["WebLa_ManufacturerPages"]="WebLa_ManufacturerPages"
            ["WebLa_CategorySorter"]="WebLa_CategorySorter"
            ["WebLa_AdminProductFilters"]="WebLa_AdminProductFilters"
            ["WebLa_FlyoutNavigation"]="WebLa_FlyoutNavigation"
            ["WebLa_CurrencyChanger"]="WebLa_CurrencyChanger"
            ["WebLa_Blog"]="WebLa_Blog"
            ["WebLa_PropertyNotes"]="WebLa_PropertyNotes"
            ["WebLa_CustomerTaxCountry"]="WebLa_CustomerTaxCountry"
          )

          # Supported languages
          LANGUAGES=("de" "en")

          for repo in "${!PLUGINS[@]}"; do
            folder="${PLUGINS[$repo]}"
            local_folder="${PLUGIN_FOLDERS[$repo]}"
            echo "📦 Syncing $repo"

            # Clean existing plugin docs in all language folders
            for lang in "${LANGUAGES[@]}"; do
              rm -rf "docs/$lang/plugins/$folder"
              mkdir -p "docs/$lang/plugins/$folder"
            done

            git clone --depth 1 --filter=blob:none --sparse \
              "https://x-access-token:${SYNC_TOKEN}@github.com/Web-Labels-Webdesign/$repo.git" temp-$repo

            cd temp-$repo
            git sparse-checkout set docs "$local_folder"
            cd ..

            if [ -d "temp-$repo/docs" ]; then
              # Sync each language folder to the correct location
              for lang in "${LANGUAGES[@]}"; do
                if [ -d "temp-$repo/docs/$lang" ]; then
                  cp -r "temp-$repo/docs/$lang/"* "docs/$lang/plugins/$folder/"
                  echo "✅ Synced $repo ($lang)"
                else
                  echo "⚠️ No $lang docs in $repo"
                fi
              done
            else
              echo "⚠️ No docs folder in $repo"
            fi

            # Extract version from composer.json and update plugins.yml
            if [ -f "temp-$repo/$local_folder/composer.json" ]; then
              VERSION=$(jq -r '.version // empty' "temp-$repo/$local_folder/composer.json")
              if [ -n "$VERSION" ]; then
                echo "📌 Version: $VERSION"
                yq -i "(.plugins[] | select(.id == \"$folder\")).version = \"$VERSION\"" data/plugins.yml
              else
                echo "⚠️ No version field in composer.json"
              fi
            else
              echo "⚠️ composer.json not found at temp-$repo/$local_folder/composer.json"
            fi

            # Generate .pages files with friendly names from plugins.yml
            for lang in "${LANGUAGES[@]}"; do
              if [ -d "docs/$lang/plugins/$folder" ]; then
                NAME=$(yq ".plugins[] | select(.id == \"$folder\") | .name.$lang" data/plugins.yml)
                if [ -n "$NAME" ]; then
                  echo "title: $NAME" > "docs/$lang/plugins/$folder/.pages"
                  echo "📝 Created .pages for $folder ($lang): $NAME"
                fi
              fi
            done

            rm -rf "temp-$repo"
          done

      - name: Commit synced docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "docs: sync plugin documentation"
          git push

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          sudo apt-get install -y pngquant
          pip install -r requirements.txt

      - name: Build documentation
        run: |
          mkdocs build
          cp site/sitemap.xml site/en/sitemap.xml

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
