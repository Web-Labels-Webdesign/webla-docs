plugins:
  - id: WebLa_Produktberater
    name:
      de: Produktberater
      en: Product Advisor
    short:
      de: Interaktiver Produktberater mit intelligenter Gewichtung
      en: Interactive product advisor with intelligent weighting
    requirements: Shopware 6.5–6.8, PHP 8.1+
    version: "7.2.2"
  - id: WebLa_MediaBooster
    name:
      de: Media Booster
      en: Media Booster
    short:
      de: Automatische Bildoptimierung für Shopware 6. Komprimiert Bilder, konvertiert zu WebP/AVIF und optimiert SEO-Metadaten für schnellere Ladezeiten und bessere Rankings.
      en: Automatic image optimization for Shopware 6. Compresses images, converts to WebP/AVIF and optimizes SEO metadata for faster loading times and better search rankings.
    requirements: Shopware 6.5–6.8, PHP 8.1+
    version: "1.3.7"
  - id: WebLa_CustomerSpecificDiscounts
    name:
      de: Kundenspezifische Rabatte
      en: Customer Specific Discounts
    short:
      de: Vergeben Sie individuelle Rabatte pro Kunde auf Kategorien, Produktgruppen oder die gesamte Kundengruppe.
      en: Assign individual discounts per customer on categories, product groups, or entire customer groups.
    requirements: Shopware 6.5–6.8, PHP 8.1+
    version: "1.5.12"
  - id: WebLa_IntelligentCrossSelling
    name:
      de: Intelligentes Cross-Selling
      en: Intelligent Cross-Selling
    short:
      de: Automatisches Cross-Selling basierend auf Kaufverhalten und Produktattributen.
      en: Automatic cross-selling based on purchasing behavior and product attributes.
    requirements: Shopware 6.5–6.8, PHP 8.1+
    version: "5.2.9"
  - id: WebLa_UTMHandler
    name:
      de: UTM-Handler
      en: UTM Handler
    short:
      de: Erfassen und analysieren Sie UTM-Parameter und Marketing-Verweise für Ihre Shopware 6 Bestellungen.
      en: Capture and analyze UTM parameters and marketing referrals for your Shopware 6 orders.
    requirements: Shopware 6.5–6.8, PHP 8.1+
    version: "5.0.0"
  - id: WebLa_BeautifiedSearch
    name:
      de: Suche als Overlay
      en: Search as Overlay
    short:
      de: Erweitert die Shopware-Suche mit einem modernen Overlay. Zeigt Produkte, Kategorien, Blog-Artikel und Hersteller in einer benutzerfreundlichen Oberfläche.
      en: Enhances Shopware search with a modern overlay interface. Displays products, categories, blog articles and manufacturers in user-friendly tabbed results.
    requirements: Shopware 6.5–6.8, PHP 8.1+
    version: "4.3.0"
  - id: WebLa_ExportDiscount
    name:
      de: Shopping Feed mit einzigartigen Rabatten
      en: Shopping Feed with Unique Discounts
    short:
      de: Zeigen Sie rabattierte Preise nur Besuchern von Preissuchmaschinen - ideal für Google Shopping, idealo, billiger.de und mehr.
      en: Show discounted prices only to visitors from price comparison sites - ideal for Google Shopping, idealo, billiger.de and more.
    requirements: Shopware 6.5–6.8, PHP 8.1+
    version: "5.1.2"
  - id: WebLa_ProductSliderAdvanced
    name:
      de: Product Slider Advanced
      en: Product Slider Advanced
    short:
      de: Erweiterter Slider für Produkte und Kategorien in Shopware 6
      en: Advanced slider for products and categories in Shopware 6
    requirements: Shopware 6.5–6.8, PHP 8.1+
    version: "5.0.4"
  - id: WebLa_Zusatzoptionen
    name:
      de: Zusatzoptionen
      en: Additional Options
    short:
      de: Erweitern Sie Produkte mit konfigurierbaren Zusatzoptionen, individueller Preisgestaltung, Versandbeschränkungen und automatischer Zuweisung durch Produktströme für mehr Flexibilität.
      en: Add flexible additional options to products with custom pricing, shipping restrictions, and automated assignment via product streams for enhanced product configuration.
    requirements: Shopware 6.6–6.8, PHP 8.1+
    version: "5.5.0"
  - id: WebLa_ContactFormFileUpload
    name:
      de: Kontaktformular – Datei-Upload
      en: Contact Form – File Upload
    short:
      de: Erweitert das Kontaktformular in Shopware 6 um eine komfortable Datei-Upload-Funktion mit Drag & Drop Unterstützung.
      en: Extends the Shopware 6 contact form with a convenient file upload feature including drag & drop support.
    requirements: Shopware 6.6–6.8, PHP 8.1+
    version: "5.0.7"
  - id: WebLa_CategorieQuickFilter
    name:
      de: Kategorie Schnellauswahl
      en: Category Quick Filter
    short:
      de: Interaktives mehrstufiges Kategorie-Dropdown für Shopware 6 Erlebniswelten. Führt Kunden schnell durch tiefe Kategoriestrukturen – ideal für Fahrzeugauswahl und Druckerzubehör.
      en: Interactive multi-level category dropdown for Shopware 6 Shopping Experiences. Guides customers through deep category structures – perfect for vehicle selectors and printer supplies.
    requirements: Shopware 6.6–6.8, PHP 8.1+
    version: "5.0.5"
  - id: WebLa_DeliveryDateSelector
    name:
      de: Wunsch-Lieferdatum für Kunden
      en: Preferred Delivery Date for Customers
    short:
      de: Wunschlieferdatum mit konfigurierbaren Pufferzeiten, automatischer Feiertags-Verwaltung je Bundesland und Berücksichtigung von Produkt-Lieferzeiten. Kompatibel mit Shopware 6.6 und 6.7.
      en: Preferred delivery date with configurable buffer times, automatic public holiday management per region and product delivery time calculation. Compatible with Shopware 6.6 and 6.7.
    requirements: Shopware 6.6–6.8, PHP 8.1+
    version: "4.0.3"
  - id: WebLa_SplitComission
    name:
      de: SplitCommission – Aufteilung der Einzelposten in Teile
      en: SplitCommission – Division of Line Items into Parts
    short:
      de: Ermöglicht Kunden, Warenkorb-Positionen mit individuellen Kommissionskommentaren zu versehen und in separate Teile aufzuteilen – bei vollem Erhalt der Staffelpreise.
      en: Allows customers to add individual commission notes to cart line items and split them into separate positions — while fully preserving tiered/bulk pricing.
    requirements: Shopware 6.6–6.8, PHP 8.1+
    version: "5.1.2"
  - id: WebLa_UltimativeBundlePlugin
    name:
      de: Ultimative Bundle Plugin
      en: Ultimate Bundle Plugin
    short:
      de: Ultimatives Bundle-Plugin für Shopware 6.
      en: Ultimate bundle plugin for Shopware 6.
    requirements: Shopware 6.6–6.8, PHP 8.1+
    version: "5.1.2"
  - id: WebLa_Subscriptions
    name:
      de: Abonnement Plugin
      en: Subscription Plugin
    short:
      de: Erweiterbares Abonnement-Plugin für Shopware 6 mit automatischer Verlängerung, flexiblen Intervallen, Mollie-Zahlungsanbindung und Kundenportal für wiederkehrende Bestellungen.
      en: Flexible subscription plugin for Shopware 6 with automatic renewals, configurable intervals, Mollie payment integration, and a self-service customer portal for recurring orders.
    requirements: Shopware 6.6–6.8, PHP 8.1+
    version: "1.7.2"
  - id: WebLa_AdcellProvisionsfreigabe
    name:
      de: ADCELL Provisionsfreigabe
      en: ADCELL Commission Approval
    short:
      de: Automatischer Abgleich und Freigabe von ADCELL Affiliate-Provisionen in Shopware 6.
      en: Automatic matching and approval of ADCELL affiliate commissions in Shopware 6.
    requirements: Shopware 6.6–6.8, PHP 8.1+
    version: "1.2.0"
  - id: WebLa_TaxCalculatorAndCountrySwitcher
    name:
      de: Steuernachkalkulation und Lieferländer
      en: Tax Calculator and Country Switcher
    short:
      de: Berechnet Produktsteuern und Versandkosten für Besucher aus anderen Ländern neu und ergänzt die Storefront um einen Länderumschalter im Header. Unterstützt Shopware 6.6 und 6.7.
      en: Recalculates product taxes and shipping costs for visitors from other countries and adds a storefront country switcher. Unified codebase for SW 6.6 and 6.7.
    requirements: Shopware 6.6–6.7, PHP 8.2+
    version: "5.1.8"
  - id: WebLa_ImageReviews
    name:
      de: Bilder in Produktbewertungen
      en: Images in Product Reviews
    short:
      de: Kunden laden Bilder direkt zu ihren Produktbewertungen hoch. Die Galerie erscheint auf der Produktseite und als CMS-Element in Erlebniswelten.
      en: Customers upload images with their product reviews. The gallery renders on the product detail page and as a CMS element in Shopping Experiences.
    requirements: Shopware 6.6–6.7, PHP 8.2+
    version: "3.1.3"
  - id: WebLa_BatchManagement
    name:
      de: Charge-Management
      en: Batch Management
    short:
      de: Verwalten Sie Chargen, Verfallsdaten und Lagerbestände im Shopware-Admin. Mit automatischen Restock-Mails, geplanter Bestandsaktualisierung und Chargen-Historie pro Auftrag.
      en: Manage batches, expiry dates and stock levels from the Shopware admin. Automated restock notifications, scheduled stock updates and per-order batch history.
    requirements: Shopware 6.6–6.7, PHP 8.1+
    version: "3.0.1"
  - id: BuildIT_ShareCart
    name:
      de: Teile deinen Warenkorb
      en: Share your cart
    short:
      de: Teile deinen Warenkorb ganz einfach per Link, E-Mail, WhatsApp oder Facebook. Deine Kunden können den geteilten Warenkorb mit einem Klick übernehmen. Automatische Bereinigung.
      en: Share your shopping cart easily via link, email, WhatsApp or Facebook. Your customers can add all shared products to their cart with one click. Includes automatic cleanup.
    requirements: Shopware 6.6–6.8, PHP 8.1+
    version: "5.0.1"
  - id: WebLa_ManufacturerPages
    name:
      de: Herstellerseiten
      en: Manufacturer Pages
    short:
      de: Erstellt automatisch SEO-optimierte Herstellerseiten mit Übersicht, Detailansicht, Produktfiltern, Sortierung und Sitemap-Integration für Ihren Shopware-Shop.
      en: Automatically creates SEO-optimized manufacturer pages with overview, detail view, product filters, sorting and sitemap integration for your Shopware store.
    requirements: Shopware 6.6–6.8, PHP 8.1+
    version: "5.0.0"
